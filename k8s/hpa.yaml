apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: empathy-hpa
  namespace: empathy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: empathy-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # Scale out when avg CPU > 70 %
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60           # Add at most 2 pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 min before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120